<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Patient | Indu Patient Care</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .add-patient-layout {
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            gap: 28px;
            align-items: center;
            max-width: 1150px;
            margin: 30px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .add-patient-image {
            padding: 20px;
            background: #f1f7f5;
            border-radius: 18px;
            box-sizing: border-box;
        }

        .add-patient-image img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            object-position: center;
            display: block;
            border-radius: 13px;
        }

        .add-patient-image h2 {
            color: #174b45;
            font-size: 25px;
            margin: 18px 0 8px;
        }

        .add-patient-image p {
            color: #526b65;
            line-height: 1.7;
            margin-bottom: 5px;
        }

        .add-patient-layout .form-container {
            width: 100%;
            max-width: none;
            margin: 0;
            box-sizing: border-box;
        }

        @media (max-width: 760px) {
            .add-patient-layout {
                grid-template-columns: 1fr;
                gap: 20px;
                margin-top: 20px;
            }

            .add-patient-image img {
                height: 230px;
            }

            .add-patient-image h2 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<header class="navbar">
    <div class="logo">✚ Indu Patient Care</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="insert.html">Add Patient</a>
        <a href="list.html">View Patients</a>
        <a href="update.html">Update</a>
        <a href="delete.html">Delete</a>
    </nav>
</header>

<section class="page-heading">
    <p class="eyebrow">PATIENT REGISTRATION</p>
    <h1 class="page-title">Add New Patient</h1>
    <p>Enter the patient details below.</p>
</section>

<div class="add-patient-layout">

    <div class="add-patient-image">
        <img src="images/add-patient.jpg"
             alt="Doctor consulting a patient">

        <h2>Better Care Starts Here</h2>
        <p>
            Register new patients and keep their information
            organised in one place.
        </p>
    </div>

    <div class="form-container">
        <form action="/insert" method="POST">
            <div class="form-grid">

                <div class="form-group">
                    <label for="name">Patient Name</label>
                    <input type="text" id="name" name="name"
                           placeholder="Enter full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                           placeholder="patient@example.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone"
                           placeholder="Enter phone number"
                           pattern="[0-9]{10}" maxlength="10" required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age"
                           min="0" max="120"
                           placeholder="Enter age" required>
                </div>

                <div class="form-group">
                    <label for="problem">Health Problem</label>
                    <input type="text" id="problem" name="problem"
                           placeholder="Enter health problem" required>
                </div>

            </div>

            <div class="form-actions">
                <button type="submit" class="action-btn">
                    Register Patient
                </button>

                <button type="reset" class="action-btn">
                    Clear Form
                </button>
            </div>
        </form>
    </div>

</div>

<footer>
    <p>© 2026 PatientCare Management System | Care Begins Here</p>
</footer>

</body>
</html>
